name: Build and publish Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:  # permet de le relancer manuellement depuis l'onglet Actions

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}  # devient ex: ghcr.io/tonpseudo/forcedfr

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Connexion à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}  # fourni automatiquement, rien à configurer

      - name: Build et push de l'image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
